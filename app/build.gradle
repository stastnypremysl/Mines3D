apply plugin: 'com.android.application'

android {
    compileSdk 36
    defaultConfig {
        applicationId "cos.premy.mines"
        minSdkVersion 19
        targetSdkVersion 36
        versionCode 16
        versionName '1.7.1'
        namespace 'cos.premy.mines'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests {
            // The Android framework classes are stubs on the unit test classpath. Returning default
            // values instead of throwing lets the tests call them in a plain JVM.
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:2.0.4'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:gridlayout-v7:28.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.20.0'
}
